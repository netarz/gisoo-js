name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Mints the OIDC token used for npm trusted publishing and the provenance statement.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Test
        run: npm test

      - name: Check that the tag matches package.json
        run: test "v$(node -p \"require('./package.json').version\")" = "${GITHUB_REF_NAME}"

      - name: Publish with provenance
        # With a trusted publisher configured on npm no token is needed (OIDC).
        # NPM_TOKEN (granular access token) is only a fallback for the first release.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
